services:
  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: app_pass
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/app_pass@XEPDB1 || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 20

  init-oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    environment:
      ORACLE_PWD: app_pass
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ./src/db/db_init:/init
    entrypoint: /init/init_entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "[ -f /tmp/init-ok ]"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      init-oracle:
        condition: service_healthy
    command: sh -c "npx knex migrate:latest && node src/app.js"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./knexfile.js:/app/knexfile.js
      - ./eslint.config.js:/app/eslint.config.js
